# Pretty URLs are already on in the Netlify UI (they 301 /bio → /bio/).
# Canonicals and the sitemap now match that slash form.

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # No camera, mic or location anywhere on a portfolio site.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Vite fingerprints everything under /_nuxt/, so the filename changes whenever
# the bytes do. Netlify's default is max-age=0, must-revalidate — a conditional
# request per asset per visit for files that can never change under that name.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# These assets keep stable filenames across replacements. Revalidate them on
# each visit so a deploy cannot leave a browser on the previous bytes.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
